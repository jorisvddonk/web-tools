<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>.env ↔ json / yaml converter</title>
  <meta name="description" content="Convert dotenv files to JSON or YAML and back, with quote and type-coercion options.">
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
</head>
<body>
  <main>
    <a class="back" href="./index.html">&larr; all tools</a>
    <h1>.env &harr; json / yaml</h1>
    <p class="subtitle">Convert dotenv files to JSON or YAML and back. Handles quoting, comments and <span class="mono">export</span>.</p>

    <div class="row" style="margin-top:0">
      <label for="modeSel" style="margin:0">Direction</label>
      <select id="modeSel" aria-label="Conversion direction">
        <option value="env2json" selected>.env &rarr; JSON</option>
        <option value="env2yaml">.env &rarr; YAML</option>
        <option value="json2env">JSON &rarr; .env</option>
        <option value="yaml2env">YAML &rarr; .env</option>
      </select>
      <span class="spacer"></span>
      <button id="exampleBtn" type="button" class="secondary">Load example</button>
    </div>

    <div class="opts">
      <label><input type="checkbox" id="liveChk" checked> Convert live</label>
      <label><input type="checkbox" id="coerceChk" checked> Coerce numbers/booleans</label>
      <label><input type="checkbox" id="quoteAllChk"> Quote all values</label>
      <label><input type="checkbox" id="sortChk"> Sort keys</label>
    </div>

    <div class="grid" style="margin-top:0.75rem">
      <div>
        <label for="input">Input</label>
        <textarea id="input" class="tall" spellcheck="false"></textarea>
      </div>
      <div>
        <label for="output">Output</label>
        <textarea id="output" class="tall" readonly spellcheck="false"></textarea>
      </div>
    </div>

    <div class="row">
      <button id="convertBtn" type="button">Convert</button>
      <button id="swapBtn" type="button" class="secondary">Swap</button>
      <button id="clearBtn" type="button" class="secondary">Clear</button>
      <span class="spacer"></span>
      <button id="copyBtn" type="button" class="secondary">Copy output</button>
    </div>

    <div class="row" style="margin-top:0.75rem">
      <span id="statusBadge" class="badge muted">waiting for input</span>
      <span id="statusHint" class="hint"></span>
    </div>
    <div class="hint" id="warnings" style="color:var(--warn)"></div>
    <div class="error" id="error" role="alert"></div>
    <div class="stats" id="stats"></div>
  </main>

  <script src="./json-locator.js"></script>
  <script src="./toolkit.js"></script>
  <script>
    "use strict";
    var input = document.getElementById("input");
    var output = document.getElementById("output");
    var modeSel = document.getElementById("modeSel");
    var liveChk = document.getElementById("liveChk");
    var coerceChk = document.getElementById("coerceChk");
    var quoteAllChk = document.getElementById("quoteAllChk");
    var sortChk = document.getElementById("sortChk");
    var statusBadge = document.getElementById("statusBadge");
    var statusHint = document.getElementById("statusHint");
    var warningsEl = document.getElementById("warnings");
    var errorEl = document.getElementById("error");
    var statsEl = document.getElementById("stats");

    var EXAMPLE = "# app config\n" +
      "export APP_ENV=production\n" +
      "APP_PORT=8080\n" +
      "DEBUG=false\n" +
      "DATABASE_URL=\"postgres://user:pass@localhost:5432/app\"\n" +
      "WELCOME=\"Hello, world\"\n" +
      "EMPTY=\n";

    function isEnvMode() { return modeSel.value.indexOf("2env") === -1; }

    function parseDotenv(text) {
      var result = Object.create(null);
      var warnings = [];

      text.replace(/\r\n?/g, "\n").split("\n").forEach(function (line, index) {
        var trimmed = line.trim();
        if (!trimmed || trimmed.charAt(0) === "#") return;
        trimmed = trimmed.replace(/^export\s+/, "");

        var eq = trimmed.indexOf("=");
        if (eq === -1) {
          warnings.push("Line " + (index + 1) + " has no '=' and was ignored.");
          return;
        }
        var key = trimmed.slice(0, eq).trim();
        var raw = trimmed.slice(eq + 1).trim();
        if (!key) {
          warnings.push("Line " + (index + 1) + " has an empty key.");
          return;
        }

        var value = "";
        if (raw.charAt(0) === '"') {
          var closed = false;
          for (var i = 1; i < raw.length; i++) {
            var c = raw[i];
            if (c === "\\") {
              var next = raw[i + 1];
              var map = { n: "\n", r: "\r", t: "\t", v: "\v", f: "\f", b: "\b", '"': '"', "\\": "\\", "$": "$" };
              if (map[next] !== undefined) { value += map[next]; i++; }
              else { value += next; i++; }
            } else if (c === '"') {
              closed = true;
              break;
            } else {
              value += c;
            }
          }
          if (!closed) warnings.push("Line " + (index + 1) + " has an unterminated double-quoted value.");
        } else if (raw.charAt(0) === "'") {
          var end = raw.indexOf("'", 1);
          if (end === -1) {
            value = raw.slice(1);
            warnings.push("Line " + (index + 1) + " has an unterminated single-quoted value.");
          } else {
            value = raw.slice(1, end);
          }
        } else {
          value = raw.replace(/\s+#.*$/, "").trim();
        }

        result[key] = value;
      });

      return { values: result, warnings: warnings };
    }

    function coerce(value) {
      if (value === "true") return true;
      if (value === "false") return false;
      if (value === "null") return null;
      if (/^-?\d+(\.\d+)?$/.test(value)) return Number(value);
      return value;
    }

    function envValue(value, forceQuotes) {
      var text = value === null || value === undefined ? "" : String(value);
      var needsQuotes = forceQuotes || text === "" || /[\s#"'\\]/.test(text) || /[\r\n]/.test(text);
      if (!needsQuotes) return text;
      return '"' + text
        .replace(/\\/g, "\\\\")
        .replace(/"/g, '\\"')
        .replace(/\n/g, "\\n")
        .replace(/\r/g, "\\r")
        .replace(/\t/g, "\\t") + '"';
    }

    function sortedKeys(object) {
      var keys = Object.keys(object);
      if (sortChk.checked) keys.sort();
      return keys;
    }

    function yamlDump(object) {
      return jsyaml.dump(object, { indent: 2, sortKeys: sortChk.checked, lineWidth: 100, noRefs: true });
    }

    function jsonError(text, e) {
      var message = e && e.message ? e.message : String(e);
      if (window.JSONLocator) {
        var located = JSONLocator.find(text);
        if (located) {
          var loc = JSONLocator.position(text, located.index);
          return located.message + " (line " + loc.line + ", column " + loc.column + ")";
        }
      }
      return message;
    }

    function yamlError(e) {
      var reason = e.reason || e.message || String(e);
      if (e.mark && typeof e.mark.line === "number") {
        return reason + " (line " + (e.mark.line + 1) + ", column " + (e.mark.column + 1) + ")";
      }
      return reason;
    }

    function convert() {
      errorEl.textContent = "";
      warningsEl.textContent = "";
      if (!input.value.trim()) {
        output.value = "";
        statusBadge.className = "badge muted";
        statusBadge.textContent = "waiting for input";
        statusHint.textContent = "";
        statsEl.textContent = "";
        return;
      }
      if (typeof jsyaml === "undefined" && modeSel.value.indexOf("yaml") !== -1) {
        errorEl.textContent = "js-yaml did not load. Check your network connection and reload.";
        statusBadge.className = "badge bad";
        statusBadge.textContent = "library unavailable";
        return;
      }

      try {
        if (isEnvMode()) {
          var parsed = parseDotenv(input.value);
          var object = Object.create(null);
          Object.keys(parsed.values).forEach(function (key) {
            object[key] = coerceChk.checked ? coerce(parsed.values[key]) : parsed.values[key];
          });
          var keys = sortedKeys(object);
          var sortedObject = Object.create(null);
          keys.forEach(function (key) { sortedObject[key] = object[key]; });

          output.value = modeSel.value === "env2json"
            ? JSON.stringify(sortedObject, null, 2)
            : yamlDump(sortedObject);
          warningsEl.textContent = parsed.warnings.join(" ");
          statusBadge.className = "badge ok";
          statusBadge.textContent = "converted";
          statusHint.textContent = keys.length + " key(s)";
          statsEl.textContent = input.value.split("\n").length + " input lines · " + output.value.split("\n").length + " output lines";
        } else {
          var data;
          var warnings = [];
          if (modeSel.value === "json2env") {
            data = JSON.parse(input.value);
          } else {
            data = jsyaml.load(input.value);
          }
          if (!data || typeof data !== "object" || Array.isArray(data)) {
            throw new Error("Expected a top-level object of key/value pairs.");
          }

          var lines = [];
          sortedKeys(data).forEach(function (key) {
            var value = data[key];
            if (value && typeof value === "object") {
              warnings.push("Value for " + key + " was serialized as JSON.");
              value = JSON.stringify(value);
            }
            lines.push(key + "=" + envValue(value, quoteAllChk.checked));
          });

          output.value = lines.join("\n");
          warningsEl.textContent = warnings.join(" ");
          statusBadge.className = "badge ok";
          statusBadge.textContent = "converted";
          statusHint.textContent = lines.length + " key(s)";
          statsEl.textContent = output.value.split("\n").length + " output lines";
        }
      } catch (e) {
        output.value = "";
        statusBadge.className = "badge bad";
        statusBadge.textContent = "conversion failed";
        statusHint.textContent = "";
        statsEl.textContent = "";
        if (isEnvMode()) {
          errorEl.textContent = modeSel.value === "env2json" ? "Invalid JSON output: " + (e.message || e) : yamlError(e);
        } else if (modeSel.value === "json2env") {
          errorEl.textContent = "Input is not valid JSON: " + jsonError(input.value, e);
        } else {
          errorEl.textContent = "Input is not valid YAML: " + yamlError(e);
        }
      }
    }

    var schedule = Toolkit.debounce(convert, 200);

    document.getElementById("convertBtn").addEventListener("click", convert);
    document.getElementById("exampleBtn").addEventListener("click", function () {
      modeSel.value = "env2json";
      input.value = EXAMPLE;
      convert();
    });
    document.getElementById("swapBtn").addEventListener("click", function () {
      if (!output.value) return;
      var previous = modeSel.value;
      input.value = output.value;
      output.value = "";
      modeSel.value = previous === "env2json" ? "json2env" : previous === "env2yaml" ? "yaml2env" : "env2json";
      convert();
    });
    document.getElementById("clearBtn").addEventListener("click", function () {
      input.value = "";
      output.value = "";
      errorEl.textContent = "";
      warningsEl.textContent = "";
      statusBadge.className = "badge muted";
      statusBadge.textContent = "waiting for input";
      statusHint.textContent = "";
      statsEl.textContent = "";
      input.focus();
    });
    document.getElementById("copyBtn").addEventListener("click", function () {
      var btn = this;
      Toolkit.copyText(output.value).then(function () { Toolkit.flash(btn, "Copied!"); });
    });
    input.addEventListener("input", function () { if (liveChk.checked) schedule(); });
    [modeSel, coerceChk, quoteAllChk, sortChk].forEach(function (el) {
      el.addEventListener("change", convert);
    });
    document.addEventListener("keydown", function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
        e.preventDefault();
        convert();
      }
    });

    statusBadge.className = "badge muted";
    statusBadge.textContent = "waiting for input";
  </script>
</body>
</html>
