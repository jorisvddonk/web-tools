<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cron expression explainer</title>
  <meta name="description" content="Explain cron expressions and see the next run times. Supports ranges, steps, lists and month/day names.">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <a class="back" href="./index.html">&larr; all tools</a>
    <h1>cron expression explainer</h1>
    <p class="subtitle">Translate a five-field cron expression and preview its next runs. Runs locally.</p>

    <label for="input">Cron expression</label>
    <input type="text" id="input" value="*/15 9-17 * * 1-5" spellcheck="false" autocomplete="off" class="mono">

    <div class="row">
      <button id="explainBtn" type="button">Explain</button>
      <span class="spacer"></span>
      <label for="presetSel" class="hint" style="margin:0;font-weight:400">Preset</label>
      <select id="presetSel" aria-label="Cron preset">
        <option value="">Choose a preset…</option>
        <option value="* * * * *">Every minute</option>
        <option value="*/5 * * * *">Every 5 minutes</option>
        <option value="0 * * * *">Every hour</option>
        <option value="0 0 * * *">Daily at midnight</option>
        <option value="0 9 * * 1-5">Weekdays at 09:00</option>
        <option value="0 9 * * 1">Mondays at 09:00</option>
        <option value="0 0 1 * *">First of the month</option>
        <option value="0 0 1 1 *">Yearly on January 1</option>
        <option value="*/15 9-17 * * 1-5">Every 15 min, business hours</option>
      </select>
    </div>

    <div class="opts">
      <label><input type="checkbox" id="utcChk"> Show next runs in UTC</label>
      <span class="hint">Local time by default. Five fields: minute hour day-of-month month day-of-week.</span>
    </div>

    <div class="row" style="margin-top:0.75rem">
      <span id="statusBadge" class="badge muted">waiting for input</span>
      <span id="statusHint" class="hint"></span>
    </div>
    <div class="error" id="error" role="alert"></div>

    <section class="card" id="descriptionCard">
      <div class="row" style="margin-top:0">
        <h2 style="margin:0">Description</h2>
        <span class="spacer"></span>
        <button id="copyDescBtn" type="button" class="secondary tiny">Copy</button>
      </div>
      <div id="description" style="font-size:1.15rem;margin-top:0.5rem">—</div>
    </section>

    <section class="card">
      <h2>Fields</h2>
      <table>
        <thead><tr><th style="width:8rem">Field</th><th style="width:11rem">Expression</th><th>Meaning</th></tr></thead>
        <tbody id="fieldsBody"></tbody>
      </table>
    </section>

    <section class="card">
      <h2>Next runs</h2>
      <ol id="nextRuns" style="margin:0;padding-left:1.4rem"></ol>
      <div class="hint" id="runsHint"></div>
    </section>
  </main>

  <script src="./toolkit.js"></script>
  <script>
    "use strict";
    var input = document.getElementById("input");
    var presetSel = document.getElementById("presetSel");
    var utcChk = document.getElementById("utcChk");
    var statusBadge = document.getElementById("statusBadge");
    var statusHint = document.getElementById("statusHint");
    var errorEl = document.getElementById("error");
    var descriptionEl = document.getElementById("description");
    var fieldsBody = document.getElementById("fieldsBody");
    var nextRunsEl = document.getElementById("nextRuns");
    var runsHint = document.getElementById("runsHint");
    var descTimer = null;

    var MONTH_NAMES = [null, "January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    var DOW_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    var MONTH_LOOKUP = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
    var DOW_LOOKUP = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };

    function pad(n) { return String(n).padStart(2, "0"); }

    function fieldValue(raw, min, max, lookup, fieldName) {
      if (/^\d+$/.test(raw)) {
        var number = Number(raw);
        if (number < min || number > max) {
          throw new Error(fieldName + ": " + raw + " is outside " + min + "-" + max + ".");
        }
        return number;
      }
      var match = lookup && lookup[raw.toLowerCase()];
      if (match !== undefined) return match;
      throw new Error(fieldName + ': "' + raw + '" is not a valid value.');
    }

    function parseField(text, min, max, lookup, fieldName) {
      var raw = text.trim();
      if (!raw) throw new Error(fieldName + " is empty.");
      if (raw === "?") raw = "*";
      var any = raw === "*";
      var values = new Set();

      raw.split(",").forEach(function (part) {
        part = part.trim();
        if (!part) throw new Error(fieldName + " has an empty list item.");

        var step = 1;
        var range = part;
        var slash = part.split("/");
        if (slash.length > 2) throw new Error(fieldName + ": invalid step in " + part);
        if (slash.length === 2) {
          range = slash[0];
          step = Number(slash[1]);
          if (!/^\d+$/.test(slash[1]) || step < 1) throw new Error(fieldName + ": invalid step in " + part);
        }

        var lo, hi;
        if (range === "*") {
          lo = min;
          hi = max;
        } else if (range.indexOf("-") !== -1) {
          var pieces = range.split("-");
          if (pieces.length !== 2) throw new Error(fieldName + ": invalid range " + range);
          lo = fieldValue(pieces[0], min, max, lookup, fieldName);
          hi = fieldValue(pieces[1], min, max, lookup, fieldName);
          if (lo > hi) throw new Error(fieldName + ": range " + range + " is backwards.");
        } else {
          lo = fieldValue(range, min, max, lookup, fieldName);
          hi = step > 1 ? max : lo;
        }

        for (var value = lo; value <= hi; value += step) {
          values.add(fieldName === "day-of-week" && value === 7 ? 0 : value);
        }
      });

      return {
        text: text.trim(),
        any: any,
        values: Array.from(values).sort(function (a, b) { return a - b; })
      };
    }

    function parseCron(expression) {
      var parts = expression.trim().split(/\s+/);
      if (parts.length !== 5) {
        throw new Error("Expected 5 fields (minute hour day-of-month month day-of-week); found " + parts.length + ".");
      }
      return {
        minute: parseField(parts[0], 0, 59, null, "minute"),
        hour: parseField(parts[1], 0, 23, null, "hour"),
        dom: parseField(parts[2], 1, 31, null, "day-of-month"),
        month: parseField(parts[3], 1, 12, MONTH_LOOKUP, "month"),
        dow: parseField(parts[4], 0, 7, DOW_LOOKUP, "day-of-week")
      };
    }

    function compress(values, names, digits) {
      var groups = [];
      var i = 0;
      function label(value) {
        if (names && names[value] !== undefined) return names[value];
        return digits ? pad(value) : String(value);
      }
      while (i < values.length) {
        var start = values[i];
        var end = start;
        while (i + 1 < values.length && values[i + 1] === end + 1) {
          i++;
          end = values[i];
        }
        if (end - start >= 2) groups.push(label(start) + "-" + label(end));
        else for (var value = start; value <= end; value++) groups.push(label(value));
        i++;
      }
      return groups.join(", ");
    }

    function describe(fields) {
      var minute = fields.minute, hour = fields.hour, dom = fields.dom, month = fields.month, dow = fields.dow;
      var stepMatch = /^\*\/(\d+)$/.exec(minute.text);
      if (stepMatch && hour.any && dom.any && month.any && dow.any) {
        return "Every " + stepMatch[1] + " minute" + (Number(stepMatch[1]) === 1 ? "" : "s");
      }

      var time;
      if (minute.any && hour.any) {
        time = "Every minute";
      } else if (minute.any) {
        time = "Every minute during hours " + compress(hour.values, null, true);
      } else if (hour.any) {
        time = "At " + (minute.values.length === 1 ? "minute " : "minutes ") +
          compress(minute.values, null, true) + " of every hour";
      } else if (minute.values.length === 1 && hour.values.length === 1) {
        time = "At " + pad(hour.values[0]) + ":" + pad(minute.values[0]);
      } else {
        time = "At minutes " + compress(minute.values, null, true) +
          " of hours " + compress(hour.values, null, true);
      }

      var day;
      if (month.any && dom.any && dow.any) {
        day = "every day";
      } else {
        var bits = [];
        if (!month.any) bits.push("in " + compress(month.values, MONTH_NAMES, false));
        if (!dom.any && !dow.any) {
          bits.push("on day " + compress(dom.values, null, false) + " or " + compress(dow.values, DOW_NAMES, false));
        } else if (!dom.any) {
          bits.push("on day " + compress(dom.values, null, false) + " of the month");
        } else if (!dow.any) {
          bits.push("on " + compress(dow.values, DOW_NAMES, false));
        } else {
          bits.push("every day");
        }
        day = bits.join(" ");
      }

      return time + ", " + day;
    }

    function fieldMeaning(field, unit, names, digits) {
      if (field.any) return "every " + unit;
      return compress(field.values, names, digits);
    }

    function renderFields(fields) {
      fieldsBody.innerHTML = "";
      var rows = [
        ["Minute", fields.minute.text, fieldMeaning(fields.minute, "minute", null, true)],
        ["Hour", fields.hour.text, fieldMeaning(fields.hour, "hour", null, true)],
        ["Day of month", fields.dom.text, fieldMeaning(fields.dom, "day", null, false)],
        ["Month", fields.month.text, fieldMeaning(fields.month, "month", MONTH_NAMES, false)],
        ["Day of week", fields.dow.text, fieldMeaning(fields.dow, "day", DOW_NAMES, false)]
      ];
      rows.forEach(function (row) {
        var tr = document.createElement("tr");
        var nameTd = document.createElement("td");
        nameTd.textContent = row[0];
        var exprTd = document.createElement("td");
        exprTd.className = "mono";
        exprTd.textContent = row[1];
        var meaningTd = document.createElement("td");
        meaningTd.textContent = row[2];
        tr.appendChild(nameTd);
        tr.appendChild(exprTd);
        tr.appendChild(meaningTd);
        fieldsBody.appendChild(tr);
      });
    }

    function nextRuns(fields, count, utc) {
      var now = new Date();
      var start;
      if (utc) {
        start = new Date(Date.UTC(
          now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(),
          now.getUTCHours(), now.getUTCMinutes() + 1, 0, 0
        ));
      } else {
        start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), now.getMinutes() + 1, 0, 0);
      }

      var runs = [];
      var maxIterations = 5 * 366 * 24 * 60;
      for (var i = 0; i < maxIterations && runs.length < count; i++) {
        var month = utc ? start.getUTCMonth() + 1 : start.getMonth() + 1;
        var dayOfMonth = utc ? start.getUTCDate() : start.getDate();
        var dayOfWeek = utc ? start.getUTCDay() : start.getDay();
        var hour = utc ? start.getUTCHours() : start.getHours();
        var minute = utc ? start.getUTCMinutes() : start.getMinutes();

        if (fields.month.any || fields.month.values.indexOf(month) !== -1) {
          var domMatch = fields.dom.any || fields.dom.values.indexOf(dayOfMonth) !== -1;
          var dowMatch = fields.dow.any || fields.dow.values.indexOf(dayOfWeek) !== -1;
          var dayMatch;
          if (fields.dom.any && fields.dow.any) dayMatch = true;
          else if (fields.dom.any) dayMatch = dowMatch;
          else if (fields.dow.any) dayMatch = domMatch;
          else dayMatch = domMatch || dowMatch;

          if (dayMatch &&
              (fields.hour.any || fields.hour.values.indexOf(hour) !== -1) &&
              (fields.minute.any || fields.minute.values.indexOf(minute) !== -1)) {
            runs.push(new Date(start.getTime()));
          }
        }

        if (utc) start.setUTCMinutes(start.getUTCMinutes() + 1);
        else start.setMinutes(start.getMinutes() + 1);
      }
      return runs;
    }

    function renderRuns(fields) {
      nextRunsEl.innerHTML = "";
      runsHint.textContent = "";
      var runs = nextRuns(fields, 8, utcChk.checked);
      if (!runs.length) {
        var li = document.createElement("li");
        li.textContent = "No runs found in the next five years.";
        nextRunsEl.appendChild(li);
        return;
      }
      runs.forEach(function (run) {
        var li = document.createElement("li");
        li.textContent = utcChk.checked
          ? run.toISOString().replace("T", " ").replace(/:\d\d\.\d{3}Z$/, " UTC")
          : run.toLocaleString(undefined, { weekday: "short", year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
        li.style.margin = "0.2rem 0";
        nextRunsEl.appendChild(li);
      });
      runsHint.textContent = utcChk.checked ? "Times are UTC." : "Times are local (" + (Intl.DateTimeFormat().resolvedOptions().timeZone || "local") + ").";
    }

    function explain() {
      errorEl.textContent = "";
      if (!input.value.trim()) {
        statusBadge.className = "badge muted";
        statusBadge.textContent = "waiting for input";
        statusHint.textContent = "";
        descriptionEl.textContent = "—";
        fieldsBody.innerHTML = "";
        nextRunsEl.innerHTML = "";
        runsHint.textContent = "";
        return;
      }

      var fields;
      try {
        fields = parseCron(input.value);
      } catch (e) {
        statusBadge.className = "badge bad";
        statusBadge.textContent = "invalid expression";
        statusHint.textContent = "";
        errorEl.textContent = e && e.message ? e.message : String(e);
        descriptionEl.textContent = "—";
        fieldsBody.innerHTML = "";
        nextRunsEl.innerHTML = "";
        runsHint.textContent = "";
        return;
      }

      var text = describe(fields);
      descriptionEl.textContent = text.charAt(0).toUpperCase() + text.slice(1) + ".";
      renderFields(fields);
      renderRuns(fields);
      statusBadge.className = "badge ok";
      statusBadge.textContent = "valid";
      statusHint.textContent = "5 fields · DOM/DOW use OR when both are restricted";
    }

    var schedule = Toolkit.debounce(explain, 220);

    document.getElementById("explainBtn").addEventListener("click", explain);
    presetSel.addEventListener("change", function () {
      if (!presetSel.value) return;
      input.value = presetSel.value;
      explain();
    });
    utcChk.addEventListener("change", explain);
    input.addEventListener("input", schedule);
    document.getElementById("copyDescBtn").addEventListener("click", function () {
      var btn = this;
      Toolkit.copyText(descriptionEl.textContent).then(function () { Toolkit.flash(btn, "Copied!"); });
    });
    document.addEventListener("keydown", function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
        e.preventDefault();
        explain();
      }
    });

    statusBadge.className = "badge muted";
    statusBadge.textContent = "waiting for input";
    explain();
  </script>
</body>
</html>
